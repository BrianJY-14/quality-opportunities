name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: clave-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato de imports y estilo
        run: ruff format --check .

      - name: Migraciones al dia con los modelos
        # Falla si alguien edito un modelo sin generar la migracion correspondiente.
        run: |
          alembic upgrade head
          alembic check

      - name: Pruebas
        run: pytest

  # La misma suite sobre PostgreSQL. SQLite no implementa FOR UPDATE, y un error que solo aparece
  # en PostgreSQL dejo las evaluaciones aprobadas colgadas en EN_EJECUCION durante la demo
  # (ADR-008). Este job evita que vuelva a pasar desapercibido.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/qo_test
      JWT_SECRET: clave-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas sobre PostgreSQL
        run: pytest
