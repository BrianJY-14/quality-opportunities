# Evita que el plan gratuito del PaaS duerma el servicio durante la evaluacion del jurado
# y el pitch. Activar (o cambiar la URL) en cuanto exista el despliegue.
name: Mantener despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    # Sin la variable BACKEND_URL (Settings -> Variables) el job no corre: en un fork o copia
    # personal no gasta minutos de Actions pingueando una URL vacia.
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.BACKEND_URL }}/health" || echo "sin respuesta"
